<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    
    <header class="bg-dark text-white text-center py-3 mb-4">
        <h1>Planificador de Tareas</h1>
    </header>

    <main class="container">
        <div class="row">
            
             
            <section class="col-md-5 mb-4">
                <div class="card p-3 shadow-sm">
                    <h3> FORMULARIO </h3>
                    <form id="task-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Título de la tarea">
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" placeholder="Descripción breve"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"> Agregar tarea</button>
                    </form>
                </div>
            </section>

            
            <section class="col-md-7">
                <div class="card p-3 shadow-sm">
                    <h3> LISTA DE TAREAS </h3>
                    <div id="task-list" class="vstack gap-2">
                         <div class="p-3 border rounded bg-light">Tarea de ejemplo 1</div>
                        <div class="p-3 border rounded bg-light">Tarea de ejemplo 2</div>
                        <div class="p-3 border rounded bg-light">Tarea de ejemplo 3</div>
                    </div>
                </div>
            </section>

        </div>
    </main>

     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
